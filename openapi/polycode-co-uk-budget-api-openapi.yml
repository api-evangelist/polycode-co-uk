openapi: 3.2.0
info:
  title: marginalia public Budget API
  version: 0.1.7
  description: Public read + chat API for marginalia (https://marginalia.polycode.co.uk). No auth today; the API is public. Generated from route-descriptors.mjs.
  license:
    name: AGPL-3.0-only
servers:
- url: https://marginalia.polycode.co.uk
  description: production
- url: https://ci-{slug}.marginalia.polycode.co.uk
  description: CI branch
  variables:
    slug:
      default: main
tags:
- name: Budget
paths:
  /api/budget:
    get:
      operationId: getBudget
      summary: Today + month-to-date spend vs caps, plus Tavily credits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: graphId
        in: query
        required: false
        schema:
          type: string
      - name: sessionUuid
        in: query
        required: false
        schema:
          type: string
      tags:
      - Budget
