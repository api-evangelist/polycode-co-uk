summary: >-
  Polycode Limited publishes an unusually explicit visitor-rights contract for a service this small: a UK GDPR
  statement with named rights, a request channel and a stated turnaround; an AI-system disclaimer that names the
  model, the hosting region and the operator before the first message; and a working notice channel (flag a
  memory, with a reason, backed by POST /api/flag and an operator resolve flow). Four of the fourteen horizontal
  signals meet the substance bar. What it does not publish: a subprocessor table, an SBOM, a support period, an
  accessibility statement, a transparency report, an incident-notification commitment, a GPC statement, an
  age-assurance mechanism or an export/portability commitment (postExport is documented as a stub).
