  host: marginalia.polycode.co.uk
  note: >-
    Served as a static S3 object behind CloudFront from the product host marginalia.polycode.co.uk, which is
    also the OpenAPI servers[] host and the declared A2A JSON-RPC host (https://marginalia.polycode.co.uk/api/a2a).
    The legacy /.well-known/agent.json path serves a byte-identical copy (2,547 bytes, cmp identical); both files
    are checked into the public source repository at app/web/.well-known/. The host is an SPA catch-all for
    EXTENSIONLESS paths (any unknown path returns the 11,792-byte index.html) but not for paths with a file
    extension (an S3 AccessDenied 403), and a negative-control /.well-known/<random>.json returned 403, so the 200
    on agent-card.json is a served document and not a catch-all. The company's registrable apex polycode.co.uk
    (the provider.url the card declares) and www.polycode.co.uk both CNAME to a CloudFront distribution
    (d76qopfbpb38m.cloudfront.net) that no longer resolves, so the corporate site is unreachable while the
    product host is live. Ownership is not in question: provider.organization is "Polycode Limited", the
    homepage disclaimer reads "Operator: Polycode Limited (UK)", the OpenAPI at the same host titles itself
    "marginalia public API", and the public repository README names Polycode Limited (UK) as operator.
