agent_card:
  name: marginalia
  description: >-
    A persistent, memory-graph-backed chat agent. Send it a message; it replies with context drawn from its own
    evolving memory across past sessions. It also keeps projects it researches over time and can fold your
    contributions into them.
  url: https://marginalia.polycode.co.uk/api/a2a
  version: 0.2.0
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  additional_interfaces:
  - {url: 'https://marginalia.polycode.co.uk/api/a2a', transport: JSONRPC}
  provider:
    organization: Polycode Limited
    url: https://polycode.co.uk
  documentation_url: https://marginalia.polycode.co.uk/api/openapi.json
  supports_authenticated_extended_card: false
  capabilities:
    streaming: true
    push_notifications: false
    state_transition_history: false
  default_input_modes: [text/plain]
  default_output_modes: [text/plain]
  security_schemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Optional today. Will gate a free monthly token allowance per key, with pay-as-you-go beyond it. See the project roadmap.'
  security: []
  skill_count: 3
  skills:
  - {id: chat, name: Open chat, tags: [chat, memory, marginalia]}
  - {id: recall-memory, name: Recall memory, tags: [memory, search, recall]}
  - {id: research-projects, name: Research projects, tags: [projects, research, collaboration]}
  skill_invocation: >-
    All three skills are served by the single JSON-RPC endpoint: the public repository README documents
    message/send (buffered; returns a working Task to poll on a slow turn) and message/stream (SSE), with the
    server minting a contextId on the first turn that the caller reuses to continue a session. A private graph is
    reached by adding an x-api-key header. POST /api/chat is documented as "a simpler alias" of the same turn.
