aid: polycode-co-uk
name: Polycode Limited
description: 'Polycode Limited is a UK information-technology consultancy (Companies House 10172940, Leeds, incorporated
  2016) that operates marginalia, a small public chat experiment built on a shared, provenance-tracked memory graph:
  a language model synthesises conversations into an OWL-typed graph and questions are answered by narrowing that
  graph with SPARQL. marginalia publishes a public REST API (OpenAPI 3.0.3, 50 operations at https://marginalia.polycode.co.uk/api
  — async chat with task polling, session search and history, insights, projects, usage and budget, key-authed private
  graphs; no key for reads and chat), an A2A 0.3.0 agent card at /.well-known/agent-card.json with a live JSON-RPC
  endpoint (message/send, message/stream, tasks/get) advertising chat, recall-memory and research-projects skills,
  an OpenAI-shaped zero-token completion shim, a first-party CLI and the AGPL-3.0 source on GitLab. Visitor contributions
  are PII-redacted at ingest and republished under CC-BY-SA 4.0; a volatile flag keeps a turn out of shared memory.
  The corporate apex polycode.co.uk did not resolve when profiled; the product host is the live web presence.'
