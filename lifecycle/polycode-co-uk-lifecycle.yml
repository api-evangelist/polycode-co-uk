  note: >-
    No SLA. The provider describes the service as "a small public chat experiment" with hard daily spend caps and
    an operator-set operating mode (normal | high | degraded | sleep); in degraded mode the autonomous turn pauses
    and chat falls back to a smaller model, and in sleep mode Bedrock is switched off ("the graph is taking a
    moment of quiet"). Callers should read GET /api/budget .status (running | running high | degraded | sleeping).
