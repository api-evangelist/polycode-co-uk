graph_lifecycle:
  note: >-
    The memory graph itself has a lifecycle the API exposes: the current default graph is retired roughly monthly
    ("Monthly retirement ceremony (~30 days)", GitLab issue #6) and archived graphs stay addressable via listGraphs
    (status default | dormant | archived, archived_at). Private graphs are created, renamed, exported (stub) and
    deleted by their owner (createPrivateGraph, renamePrivateGraph, postExport, deletePrivateGraph).
